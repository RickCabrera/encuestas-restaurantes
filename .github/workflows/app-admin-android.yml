name: App admin Android

# Compila la app de administradores (android-admin/): APK firmado para instalar directo y AAB
# firmado para Google Play. Opcional: lo sube a Play (prueba interna, borrador).
# Instrucciones y secrets: docs/APP-ADMIN.md
on:
  workflow_dispatch:
    inputs:
      subir_a_play:
        description: "Subir el AAB a Google Play (prueba interna, como borrador)"
        type: boolean
        default: false
  push:
    branches: [main, feature/app-admin-movil]
    tags: ["admin-v*"]
    paths:
      - "android-admin/**"
      - ".github/workflows/app-admin-android.yml"

concurrency:
  group: app-admin-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android-admin
    env:
      # La misma llave que la app de tablets (docs/TABLET-APK.md). En Play es la "llave de subida".
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      # Cada compilación tiene un versionCode mayor (Play rechaza números repetidos).
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - name: Comprobar secrets de firma
        run: |
          missing=""
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Faltan secrets de firma:$missing. Ver docs/APP-ADMIN.md"
            exit 1
          fi

      - name: Versión
        run: |
          if [[ "$GITHUB_REF" == refs/tags/admin-v* ]]; then v="${GITHUB_REF_NAME#admin-v}"; else v="1.0.$GITHUB_RUN_NUMBER"; fi
          echo "VERSION_NAME=$v" >> "$GITHUB_ENV"
          echo "Versión $v ($VERSION_CODE)"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Preparar keystore
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Pruebas y compilación (APK + AAB)
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease bundleRelease --console=plain

      - name: Verificar firmas y nombrar archivos
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          aab=app/build/outputs/bundle/release/app-release.aab
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$build_tools/apksigner" verify --print-certs "$apk"
          jarsigner -verify "$aab" | tail -1
          "$build_tools/aapt2" dump badging "$apk" | grep -E "^package:|targetSdkVersion"
          base="cuentanos-admin-$VERSION_NAME-$VERSION_CODE"
          mkdir -p dist
          cp "$apk" "dist/$base.apk"
          cp "$aab" "dist/$base.aab"
          (cd dist && sha256sum "$base.apk" "$base.aab" > "$base.sha256" && cat "$base.sha256")
          echo "ARTIFACT_NAME=$base" >> "$GITHUB_ENV"
          echo "AAB_PATH=android-admin/dist/$base.aab" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: android-admin/dist/
          if-no-files-found: error
          retention-days: 90

      - name: Subir a Google Play (prueba interna)
        if: env.PLAY_SERVICE_ACCOUNT_JSON != '' && (startsWith(github.ref, 'refs/tags/admin-v') || inputs.subir_a_play)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: mx.sitirt.encuestas.admin
          releaseFiles: ${{ env.AAB_PATH }}
          track: internal
          status: draft

      - name: Borrar keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
