name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: encuestas_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/encuestas_test
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/encuestas_e2e
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/encuestas_e2e
      AUTH_SECRET: ci-secret-0123456789abcdef0123456789abcdef
      APP_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tipos
        run: npm run typecheck
      - name: Pruebas unitarias y de integración
        run: npm test
      - name: Crear BD de E2E
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c "create database encuestas_e2e"
      - name: Build
        run: npm run build
      - name: Instalar navegador
        run: npx playwright install --with-deps chromium
      - name: Pruebas E2E
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
